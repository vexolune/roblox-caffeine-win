[package]
name = "roblox-caffeine-win"
version = "2.1.1"
edition = "2021"
authors = ["vexolune", "EbadShelby"]
description = "Ultra-lightweight Windows anti-AFK utility for Roblox via ViGEmBus virtual Xbox 360 controller"

[dependencies]
vigem-client = "0.1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
]

[build-dependencies]
# We use custom build.rs calling windres directly

[profile.release]
opt-level = "z"       # Optimize for smallest binary size
lto = true             # Link-Time Optimization across crates
codegen-units = 1      # Maximize optimizations
panic = "abort"        # Remove panic unwinding tables
strip = true           # Strip all debug symbols
